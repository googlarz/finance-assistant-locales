name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # test_us_tax_via_tax_engine_does_not_error and test_future_year_falls_back_to_most_recent
      # import scripts/tax_engine.py and a locales/ package that only exist once this repo is
      # embedded inside the finance-assistant monorepo — they can't pass standalone here.
      - run: >
          python -m pytest tests/ -q
          --deselect tests/test_locale_us.py::test_us_tax_via_tax_engine_does_not_error
          --deselect tests/test_locale_us.py::test_future_year_falls_back_to_most_recent
